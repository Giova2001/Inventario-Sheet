{% extends 'base.html' %}{% block content %}<h1>Categorías de Inventario</h1><div class="two-cols"><section class="panel"><div class="panel-head" id="categoryTitle">Nueva Categoría</div><form id="categoryForm" class="stack" action="{{url_for('guardar_categoria')}}" method="post"><input type="hidden" name="id"><label>Nombre<input name="nombre" required></label><label>Descripción<textarea name="descripcion" rows="4"></textarea></label><button class="yellow">Guardar</button></form></section><section class="panel"><div class="tablewrap"><table><thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Cant. Productos</th><th>Acciones</th></tr></thead><tbody>{% for c in categorias %}<tr><td>{{c.id}}</td><td>{{c.nombre}}</td><td>{{c.descripcion}}</td><td><span class="tag cyan">{{c.total}}</span></td><td class="actions"><button onclick='editCategory({{dict(c)|tojson}})'>✎ Editar</button><form method="post" action="{{url_for('borrar_categoria',cid=c.id)}}" onsubmit="return confirm('¿Borrar categoría?')"><button>▤ Borrar</button></form></td></tr>{% endfor %}</tbody></table></div></section></div>{% endblock %}
